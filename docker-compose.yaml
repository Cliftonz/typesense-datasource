services:
  grafana:
    extends:
      file: .config/docker-compose-base.yaml
      service: grafana

  typesense27:
    image: typesense/typesense:27.1
    command: --data-dir=/data --api-key=test-key
    ports:
      - 8107:8108
    tmpfs:
      - /data

  typesense30:
    image: typesense/typesense:30.2
    command: --data-dir=/data --api-key=test-key
    ports:
      - 8109:8108
    tmpfs:
      - /data
