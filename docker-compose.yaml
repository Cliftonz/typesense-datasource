services:
  grafana:
    extends:
      file: .config/docker-compose-base.yaml
      service: grafana

  typesense27:
    image: typesense/typesense:27.1
    command: --data-dir=/data --api-key=test-key
    ports:
      - 8107:8108
    tmpfs:
      - /data

  typesense30:
    image: typesense/typesense:30.2
    command: --data-dir=/data --api-key=test-key
    ports:
      - 8109:8108
    tmpfs:
      - /data
    healthcheck:
      test: ['CMD', 'bash', '-c', 'exec 3<>/dev/tcp/localhost/8108 && printf "GET /health HTTP/1.0\r\n\r\n" >&3 && grep -q "\"ok\":true" <&3']
      interval: 2s
      start_period: 30s
      retries: 10

  seed:
    image: curlimages/curl:8.11.1
    entrypoint: ['sh', '/seed/seed.sh']
    volumes:
      - ./scripts/seed:/seed:ro
    depends_on:
      typesense30:
        condition: service_healthy
